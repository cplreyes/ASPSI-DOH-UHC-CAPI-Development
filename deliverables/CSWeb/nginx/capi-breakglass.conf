# CAPI Console — break-glass access (E9-ADMIN-010).            Carl, 2026-08-09
# Deploy to /opt/elestio/nginx/conf.d/capi-breakglass.conf
#   (host-mounted into the elestio-nginx container at /etc/nginx/conf.d/)
#
# WHAT IT IS
# A way into the console that does not depend on the identity provider, the
# main vhost, or any part of the cutover. It exists so that "I broke the gate"
# is a ten-minute problem instead of an outage.
#
#   ssh -i ~/.ssh/aspsi-csweb -L 8443:127.0.0.1:8443 root@207.148.65.115
#   then open  https://127.0.0.1:8443/docs/dashboard.html
#
# The browser will warn about the certificate name: the cert is issued for
# vm.elestio.app and you are addressing 127.0.0.1. That is expected. Accept it.
# TLS is here so `Secure` cookies are still set — without it you could read
# pages but never sign in to the admin API, which is most of the point.
#
# WHY LOOPBACK RATHER THAN A PUBLIC ALT PORT
# This host has NO operating-system firewall — `iptables -L INPUT` is ACCEPT
# and ufw is not installed (verified 2026-08-09). Any port opened here is
# immediately world-reachable. Binding 127.0.0.1 makes SSH the perimeter,
# which is a key we already hold and already protect, instead of standing up a
# second internet-facing login for the one system whose login is in question.
#
# WHY IT HAS ITS OWN CREDENTIAL FILE
# It must not depend on anything the cutover changes. capi-breakglass.htpasswd
# is a FROZEN COPY of /opt/app/lamp/www/.htpasswd-docs taken 2026-08-09, so the
# password that works today still works afterwards, when nothing writes
# .htpasswd any more. It is deliberately NOT kept in sync: a break-glass
# credential that tracks the live system shares the live system's failures.
#
# NEVER REMOVE THIS FILE, and never give this server block an auth_request.

server {
  listen 127.0.0.1:8443 ssl;
  server_name capi-breakglass;

  # The elestio host certificate. Name will not match 127.0.0.1; see above.
  ssl_certificate     /etc/nginx/certs/cert.pem;
  ssl_certificate_key /etc/nginx/certs/key.pem;

  # Parity with the main vhost — CSPro clients send large/underscore headers,
  # and the console's own pages are generated by the same builders.
  client_header_buffer_size 32k;
  large_client_header_buffers 4 64k;
  underscores_in_headers on;

  add_header X-Robots-Tag "noindex, nofollow" always;

  location / {
    auth_basic           "CAPI break-glass";
    auth_basic_user_file /etc/nginx/conf.d/capi-breakglass.htpasswd;

    proxy_http_version 1.1;
    proxy_pass http://172.17.0.1:8080;

    # Host is forced to the production name so the app builds the same links
    # and cookie domain it would normally, rather than ones pointing at
    # 127.0.0.1 that would break the moment you left the tunnel.
    proxy_set_header Host              capi.asiansocial.org;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 180s;

    # Header hygiene, same rule as the main vhost (E9-ADMIN-009): a client may
    # never assert its own identity. Blanked rather than omitted, because an
    # omitted proxy_set_header passes the client's value straight through.
    proxy_set_header X-Auth-User   "";
    proxy_set_header X-Auth-Roles  "";
    proxy_set_header X-Auth-Reason "";
    proxy_set_header X-Original-URI "";
  }
}
