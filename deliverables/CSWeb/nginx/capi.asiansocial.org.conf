server {
  listen 443 ssl;
  http2 on;
  include resty-server-https.conf;
  server_name capi.asiansocial.org;

  # parity with the csweb vhost — CSPro clients send large/underscore headers
  client_header_buffer_size 32k;
  large_client_header_buffers 4 64k;
  underscores_in_headers on;

  include /usr/local/openresty/nginx/conf/error-pages.conf;

  # ---- CSWeb app + CSEntry SYNC API, now also served on capi (Carl 2026-07-28:
  # capi becomes the canonical host, csweb retired after the user announcement).
  # NO auth_request here: CSEntry cannot do cookie sign-in — the API has its own
  # OAuth (Bearer) auth, passed through via the Authorization header.
  location /csweb/ {
    proxy_http_version 1.1;
    proxy_pass http://172.17.0.1:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_connect_timeout 180s;
  }

  # ---- the /docs console tree (dashboard, map, data room, admin, sign-in) ----
  location /docs/ {
    proxy_http_version 1.1;
    proxy_pass http://172.17.0.1:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 180s;

    # ---- header hygiene (E9-ADMIN-009) ----
    # nginx forwards any request header it is not told to override, so without
    # these four lines a client can simply SEND `X-Auth-User: cplreyes`.
    # /docs/admin/api.php's actor() trusts that header first (it has to: after
    # cutover PHP_AUTH_USER and REMOTE_USER are both empty), which made every
    # audit row forgeable by anyone already past the gate. Verified live on
    # 2026-08-09 with a header reflector before this was added.
    #
    # Blanked, not omitted: omitting a proxy_set_header is exactly what passes
    # the client's value through. At cutover these are replaced by
    # auth_request_set values from the subrequest — same names, trusted source.
    proxy_set_header X-Auth-User    "";
    proxy_set_header X-Auth-Roles   "";
    proxy_set_header X-Auth-Reason  "";
    proxy_set_header X-Original-URI "";

    # ---- no shared-cache retention of gated content (E9-ADMIN-045) ----
    # authz.php sets Cache-Control on the SUBREQUEST, which nginx discards, so
    # protected case JSON and data-room files were shipping cacheable. Applied
    # here, at the only layer that sees the real response. `always` so it
    # covers error responses too, and proxy_hide_header first so there is one
    # Cache-Control rather than two contradictory ones.
    #
    # Everything under /docs/ is gated content — a console for twenty people —
    # so the bytes saved by caching are not worth a respondent's case detail
    # sitting in a shared browser cache.
    # Only Cache-Control is added here. nosniff and Referrer-Policy are already
    # set by Apache and by the elestio global config — verified with curl — and
    # a second identical header is noise that makes the real ones harder to
    # audit.
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, private" always;
  }

  # ---- auth check for the static portal: 200 = signed in, 401 = anonymous ----
  location = /_capi_auth {
    internal;
    proxy_pass http://172.17.0.1:8080/docs/whoami.php;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie $http_cookie;
  }
  location @capi_login {
    return 302 https://capi.asiansocial.org/docs/login.php?next=https://capi.asiansocial.org$request_uri;
  }

  # ---- the static portal (capi-www), gated behind the shared session ----
  location / {
    auth_request /_capi_auth;
    error_page 401 = @capi_login;
    proxy_http_version 1.1;
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Header hygiene, same reasoning as /docs/ above. capi-www is a static
    # nginx that reads none of these today, which is exactly why it would be
    # missed the day something there starts to.
    proxy_set_header X-Auth-User    "";
    proxy_set_header X-Auth-Roles   "";
    proxy_set_header X-Auth-Reason  "";
    proxy_set_header X-Original-URI "";
  }
}
