# ---------------------------------------------------------------------------
# UHC Y2 CAPI console — form login / logout.            Carl, 2026-07-28.
#
# Replaces the browser's Basic-auth popup with a real sign-in page and, more
# importantly, gives the console a working SIGN OUT: HTTP Basic has no logout
# by design, because the browser keeps replaying the credentials.
#
# Credentials are unchanged — the same .htpasswd-docs bcrypt file backs both
# schemes, so no user has to be re-created and RBAC stays exactly as it was.
# The three `Require user` lists still live in their .htaccess files, which is
# what the admin console rewrites; only AuthType changes there.
#
# SAFETY NOTES
#  * This file lives in the host-mounted vhosts dir, so it survives container
#    recreation. LoadModule is legal here because sites-enabled/*.conf is
#    included at server-config scope.
#  * The session cookie is path-scoped to /docs/ so it is NEVER sent to
#    /csweb/ — tablet sync must not be touched while pretest is running.
#  * The cookie is encrypted (mod_session_crypto). Without it mod_session_cookie
#    stores the credentials in the clear in the client's cookie.
# ---------------------------------------------------------------------------

LoadModule request_module        /usr/lib/apache2/modules/mod_request.so
LoadModule session_module        /usr/lib/apache2/modules/mod_session.so
LoadModule session_cookie_module /usr/lib/apache2/modules/mod_session_cookie.so
LoadModule session_crypto_module /usr/lib/apache2/modules/mod_session_crypto.so
LoadModule auth_form_module      /usr/lib/apache2/modules/mod_auth_form.so

# Session + form-auth provider for the whole /docs tree. Declaring it here does
# NOT protect anything on its own — protection still comes from the Require
# lines in the per-directory .htaccess files.
<Location /docs>
    Session On
    SessionCookieName uhcsess path=/docs/;httponly;secure;SameSite=Lax
    SessionCryptoPassphrase @@PASSPHRASE@@  # redacted in the vault copy
    SessionMaxAge 28800
    AuthFormProvider file
    AuthUserFile /var/www/html/.htpasswd-docs
    ErrorDocument 401 /docs/login.php
</Location>

# The login form posts here. mod_auth_form validates, then redirects to the
# httpd_location field the form carries (the page the user originally wanted).
<Location /docs/auth/login>
    SetHandler form-login-handler
    AuthType Form
    AuthName "UHC Y2 Console"
    Session On
    SessionCookieName uhcsess path=/docs/;httponly;secure;SameSite=Lax
    SessionCryptoPassphrase @@PASSPHRASE@@  # redacted in the vault copy
    SessionMaxAge 28800
    AuthFormProvider file
    AuthUserFile /var/www/html/.htpasswd-docs
    AuthFormLoginRequiredLocation https://csweb.asiansocial.org/docs/login.php?e=1
    AuthFormLoginSuccessLocation https://csweb.asiansocial.org/docs/
    Require all granted
</Location>

# Sign out: expire the session cookie, then land on the goodbye page. This is
# the thing Basic auth cannot do.
<Location /docs/auth/logout>
    SetHandler form-logout-handler
    Session On
    SessionCookieName uhcsess path=/docs/;httponly;secure;SameSite=Lax
    SessionCryptoPassphrase @@PASSPHRASE@@  # redacted in the vault copy
    SessionMaxAge 1
    AuthFormLogoutLocation https://csweb.asiansocial.org/docs/login.php?bye=1
    Require all granted
</Location>

# Lets the static gated pages show "signed in as X" in their topbar.
<Location /docs/whoami.php>
    AuthType Form
    AuthName "UHC Y2 Console"
    AuthFormProvider file
    AuthUserFile /var/www/html/.htpasswd-docs
    Require valid-user
</Location>
