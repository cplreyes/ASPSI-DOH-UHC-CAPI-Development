# Deploy to /opt/app/lamp/config/vhosts/10-uhc-redirects.conf
# (loaded by `IncludeOptional sites-enabled/*.conf`; 10- so it reads after the
# 00- auth conf, and a SEPARATE file so URL moves never touch access control).
#
# Console unification Slice 3+4 (2026-08-09): the live pages moved into the
# static portal's URL space — the nav entry IS the page now, same pattern as
# tabulations since 2026-07-28. These 301s keep every old bookmark, generated
# footer and external link working. Retire them together with their ACL rules,
# one full survey round after rollout (owner: Carl).
#
# TWO RULES ARE DELIBERATELY ABSENT:
#   /docs/data/<file>  — the 149 export payloads DID NOT MOVE. Only the bare
#                        directory redirects, hence the ^…$ anchor: an
#                        unanchored rule here is a prefix match and would bounce
#                        every CSV/SPSS/Stata/R download to an index page.
#   /docs/admin/       — its redirect lives in NGINX, not here. The Slice-5
#                        portal path proxies BACK to Apache's /docs/admin/, so
#                        an Apache-level redirect would answer the proxy's own
#                        request with a 301 and loop forever.

RedirectMatch 301 ^/docs/dashboard\.html$ https://capi.asiansocial.org/projects/uhc-y2/monitoring/
RedirectMatch 301 ^/docs/map\.html$       https://capi.asiansocial.org/projects/uhc-y2/monitoring/map/

# Slice 4: ONLY the bare directory — the ^…$ anchor is what keeps the 149
# downloads beneath it resolving. Do not "simplify" this into Redirect 301.
RedirectMatch 301 ^/docs/data/$           https://capi.asiansocial.org/projects/uhc-y2/data/
