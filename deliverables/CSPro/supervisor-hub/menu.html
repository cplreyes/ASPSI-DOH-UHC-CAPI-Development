<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu</title>
<!--
  Supervisor-hub role menu, rendered by htmldialog("menu.html") from MENU_PICK. PROMPT-FREE + SECURE:
  htmldialog() uses the deprecated CSPro.* interface, which does NOT trip the Action-Invoker
  "Allow Access?" consent gate that the accept()/'choice' HtmlDialog does. Input:
  {title, groups:[{header, items:[{label, action}]}]}. A tapped item returns its action wrapped as
  "<<action>>" via CSPro.returnData, so the logic's pos() routing survives whatever encoding the
  htmldialog return comes back in. Self-contained (inline CSS + vanilla JS), report.html green theme.
-->
<style>
  :root { --green:#00532f; --greenlt:#e3f0ea; --line:#cfd8d3; --ink:#1a1a1a; --muted:#5b6b63; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; font-family:-apple-system,Roboto,Arial,sans-serif; color:var(--ink); background:#fff; }
  .hdr { background:var(--green); color:#fff; padding:11px 14px; }
  .hdr h1 { font-size:15px; margin:0; font-weight:600; line-height:1.25; }
  .gh { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--green);
        background:var(--greenlt); padding:7px 14px; font-weight:700; }
  .item { display:flex; align-items:center; padding:13px 14px; border-bottom:1px solid var(--line);
          font-size:15px; line-height:1.3; }
  .item:active { background:var(--greenlt); }
  .item .lbl { flex:1; }
  .item .chev { color:var(--muted); font-size:20px; margin-left:8px; }
</style>
</head>
<body>
<div class="hdr"><h1 id="title">Menu</h1></div>
<div id="list"></div>
<script>
  function csGetInput(){ var v;
    try{ if(typeof CS!=="undefined"&&CS.UI&&CS.UI.getInputData) v=CS.UI.getInputData(); }catch(e){}
    try{ if((v==null)&&typeof CSPro!=="undefined"&&CSPro.getInputData) v=CSPro.getInputData(); }catch(e){}
    if(typeof v==="string"){ try{ return JSON.parse(v); }catch(e){ return {}; } } return v||{}; }
  function csReturn(action){ var payload="<<"+action+">>";
    try{ if(typeof CS!=="undefined"&&CS.UI&&CS.UI.closeDialog){ CS.UI.closeDialog(payload); return; } }catch(e){}
    try{ if(typeof CSPro!=="undefined"&&CSPro.returnData){ CSPro.returnData(payload); return; } }catch(e){}
    try{ window.close(); }catch(e){} }
  function csSetDisplay(o){ var s=JSON.stringify(o);
    try{ if(typeof CS!=="undefined"&&CS.UI&&CS.UI.setDisplayOptions){ CS.UI.setDisplayOptions(o); return; } }catch(e){}
    try{ if(typeof CSPro!=="undefined"&&CSPro.setDisplayOptions) CSPro.setDisplayOptions(s); }catch(e){} }
  function esc(v){ return String(v==null?"":v).replace(/[<>&]/g,function(c){return c==="<"?"&lt;":c===">"?"&gt;":"&amp;";}); }
  function render(){
    var input=csGetInput(); var groups=(input&&input.groups)||[]; var g,i;
    document.getElementById("title").textContent=(input&&input.title)||"Menu";
    var host=document.getElementById("list"), html="";
    for(g=0;g<groups.length;g++){ var grp=groups[g];
      if(grp.header) html+="<div class='gh'>"+esc(grp.header)+"</div>";
      var items=grp.items||[];
      for(i=0;i<items.length;i++){ var it=items[i];
        html+="<div class='item' data-action='"+esc(it.action)+"'><span class='lbl'>"+esc(it.label)+"</span><span class='chev'>&rsaquo;</span></div>"; } }
    host.innerHTML=html;
    var rows=host.querySelectorAll(".item");
    for(i=0;i<rows.length;i++){ rows[i].addEventListener("click",function(){ csReturn(this.getAttribute("data-action")); }); }
    var w=Math.min(Math.max(document.body.scrollWidth,300),460);
    var h=Math.min(document.body.scrollHeight+16,720);
    csSetDisplay({width:w,height:h,resizable:false,keyboard:0}); }
  if(document.readyState!=="loading") render(); else document.addEventListener("DOMContentLoaded",render);
</script>
</body>
</html>
