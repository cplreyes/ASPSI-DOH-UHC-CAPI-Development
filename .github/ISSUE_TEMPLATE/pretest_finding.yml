name: Pretest Finding (field)
description: Report anything you saw during the UHC Year-2 pre-test — any instrument, any site. Use this while you are in the field.
title: "[PRETEST] "
labels: ["pretest", "from-pretest-2026-07"]
body:
  - type: markdown
    attributes:
      value: |
        **Thanks for reporting!** No technical knowledge needed — just describe what you saw.
        One form per finding. A photo of the tablet screen helps a lot.

        Only the first three boxes are required. If you are unsure of anything else, leave it blank.

  - type: dropdown
    id: instrument
    attributes:
      label: Which survey were you running?
      options:
        - F1 — Facility Head Survey
        - F2 — Healthcare Worker Survey (phone/browser)
        - F3 — Patient Survey
        - F4 — Household Survey
        - Supervisor / Enumerator Hub (login, menu, sync)
        - Not sure / something else
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Describe what you saw on the tablet, in your own words.
      placeholder: e.g. After I answered Q45 "No", the app skipped straight to Q47 and never asked Q45.2.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: e.g. It should have asked Q45.2 "Why are you not registered?"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: How badly did it affect the interview?
      options:
        - Blocker — could not finish the interview
        - High — had to work around it, data may be wrong
        - Medium — annoying but the interview finished fine
        - Low — cosmetic (spelling, spacing, wording)
    validations:
      required: false

  - type: dropdown
    id: site
    attributes:
      label: Pre-test site
      options:
        - Brgy. Mayondon (household)
        - Laguna Provincial Hospital — Bay
        - Los Baños RHU I
        - St. Jude
        - Los Baños Doctors Hospital (LBDH)
        - Other / more than one
    validations:
      required: false

  - type: input
    id: tester
    attributes:
      label: Your name or enumerator ID
      placeholder: e.g. Aly, or se-003
    validations:
      required: false

  - type: input
    id: qn
    attributes:
      label: Questionnaire Number (if you have it)
      description: The 12-digit number on the first screen. Helps us find the exact case.
      placeholder: e.g. 043404021001
    validations:
      required: false

  - type: input
    id: question_ref
    attributes:
      label: Section / question number
      placeholder: e.g. Section G, Q45.2
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: Photo or screen recording
      description: Drag an image in, or take a photo of the tablet screen and attach it.
    validations:
      required: false

  - type: input
    id: device
    attributes:
      label: Tablet / app version (if known)
      placeholder: e.g. itel P10001L, F4 v1.4.4
    validations:
      required: false
